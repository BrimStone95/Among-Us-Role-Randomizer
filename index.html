<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay - Randomizer Ruoli</title>
    <!-- Importo il font Fredoka, molto simile a quello di Among Us -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        body {
            font-family: 'Fredoka', sans-serif;
            /* Immagine di sfondo spaziale con gradiente scuro per la leggibilità */
            background-image: linear-gradient(rgba(20, 20, 30, 0.85), rgba(20, 20, 30, 0.85)), url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=3000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow-y: scroll; 
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { display: none; }
        
        /* Stile titolo alla Among Us con bordi neri spessi */
        h1 { 
            color: #fff; 
            font-size: 3.5rem;
            letter-spacing: 2px;
            text-shadow: 
                -3px -3px 0 #000,
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 6px  6px 0 rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        /* Menu di navigazione */
        .top-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            background-color: rgba(30, 30, 36, 0.95);
            padding: 15px;
            border-radius: 15px;
            border: 4px solid #000;
            box-shadow: 0 8px 0 #000;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-btn {
            background-color: #576574;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            border: 3px solid #000;
            border-radius: 8px;
            padding: 10px 18px;
            box-shadow: 0 4px 0 #000;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .nav-btn:hover {
            filter: brightness(1.1);
        }
        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }
        .nav-btn.active {
            background-color: #1dd1a1;
            color: #000;
        }

        /* Controlli Estrazione */
        .controls {
            margin-bottom: 40px;
            background-color: rgba(47, 53, 66, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            display: inline-block;
            border: 4px solid #000;
            box-shadow: 0 8px 0 #000;
        }
        .controls label {
            font-weight: 600;
            font-size: 18px;
        }
        select, .action-btn {
            font-family: 'Fredoka', sans-serif;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: 700;
            margin: 5px 10px;
            border-radius: 8px;
            border: 3px solid #000;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        select { background-color: #ffffff; color: #000000; outline: none; }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }
        .btn-draw { background-color: #2ed573; color: #000; }
        .btn-draw:hover { background-color: #27ae60; }
        .btn-reset { background-color: #ff4757; color: #fff; }
        .btn-reset:hover { background-color: #e84118; }

        /* Griglia Carte */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1700px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        .card {
            background-color: rgba(47, 53, 66, 0.95);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 1); /* Ombra dura stile fumetto */
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            border: 4px solid #000;
        }
        .card:hover { transform: scale(1.03) translateY(-5px); }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 250px;
            object-fit: contain;
            filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.6));
        }
        .card-title { 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }
        .card-category { 
            font-size: 16px; 
            font-weight: 600;
            color: #ced6e0; 
            background-color: rgba(0, 0, 0, 0.5); 
            padding: 6px 15px; 
            border-radius: 20px;
            border: 2px solid #000;
        }
        .card-description {
            font-size: 15px;
            color: #f1f2f6;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            white-space: pre-wrap;
            text-align: left;
            line-height: 1.5;
            width: 100%;
            box-sizing: border-box;
            border-left: 5px solid #ff4757;
            border-right: 2px solid #000;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        /* Sezioni */
        #faction-section { display: none; }
    </style>
</head>
<body>

    <h1>Generatore Ruoli Moddati</h1>

    <!-- Menu Fazioni -->
    <div class="top-nav">
        <button class="nav-btn active" onclick="switchTab('randomizer', this)">🎲 Estrazione</button>
        <button class="nav-btn" onclick="switchTab('impostori', this)">Impostori</button>
        <button class="nav-btn" onclick="switchTab('astronauti_controllo', this)">A. Controllo</button>
        <button class="nav-btn" onclick="switchTab('astronauti_protezione', this)">A. Protezione</button>
        <button class="nav-btn" onclick="switchTab('astronauti_uccisore', this)">A. Uccisori</button>
        <button class="nav-btn" onclick="switchTab('astronauti_vari', this)">A. Vari</button>
        <button class="nav-btn" onclick="switchTab('neutrali_passivi', this)">Neutrali Passivi</button>
        <button class="nav-btn" onclick="switchTab('neutrali_assassini', this)">Neutrali Assassini</button>
        <button class="nav-btn" onclick="switchTab('congrega', this)">Congrega</button>
    </div>
    
    <!-- Sezione Randomizer -->
    <div id="randomizer-section">
        <div class="controls">
            <label for="cardCount">Carte da estrarre: </label>
            <select id="cardCount">
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
            </select>
            <button class="action-btn btn-draw" onclick="drawCards(false)">Estrai / Aggiungi</button>
            <button class="action-btn btn-reset" onclick="drawCards(true)">Resetta Tutto</button>
        </div>
        <div class="cards-grid" id="randomCardsContainer"></div>
    </div>

    <!-- Sezione Elenco Fazioni -->
    <div id="faction-section">
        <div class="cards-grid" id="factionCardsContainer"></div>
    </div>

        const descriptionsMap = {
            "Abissale": "In qualità di Abissale, sei un impostore con la capacità di piazzare dei buchi neri premendo il tasto SVANISCI. I giocatori che entreranno in contatto con i buchi neri verranno risucchiati senza lasciare corpi per terra e di conseguenza non potranno essere reportati. Occhio: puoi uccidere anche il tuo compagno con i buchi neri.",
            "Accalappiatore": "In qualità di Accalappiatore, sei un astronauta con la capacità di piazzare trappole usando il tasto PET. Quando un giocatore calpesta una trappola, il suo ruolo viene registrato. Nella riunione successiva, riceverai un messaggio con l'elenco dei ruoli catturati nelle tue trappole.",
            "Accecatore": "In qualità di Accecatore, sei un impostore con la capacità di accecare gli altri giocatori (vedrai i loro nomi in nero) lanciando delle flashbang col tasto SVANISCI. I giocatori accecati avranno lo schermo nero per 5 secondi. Gli altri impostori sono immuni alle flashbang.",
            "Accumulatore": "In qualità di Accumulatore, sei un neutrale con la capacità di iniziare con una base da astronauta e svolgere le task per ridurre il tuo tempo di ricarica delle uccisioni. Puoi infine trasformarti in un killer neutrale con il tempo di ricarica accumulato per uccidere tutti e vincere. (tasto PET)",
            "Agitatore": "In qualità di Agitatore, sei un neutrale con la capacità di passare una bomba agli altri giocatori, in modo simile al gioco della Patata Bollente. Chi possiede la bomba quando viene indetta una riunione, o chi cerca di passarla a ruoli immuni come la Pestilenza, muore all'istante. (tasto UCCIDI)",
            "Alchimista": "In qualità di Alchimista, sei un astronauta con la capacità di creare pozioni completando le task. Le pozioni create appariranno sotto il nome del giocatore con la relativa descrizione e istruzioni (tasto PET per usare le pozioni). Puoi ottenere 7 pozioni diverse:\n1) Pozione invisibilità\n2) Pozione riparazione\n3) Pozione scudo\n4) Pozione vista\n5) Pozione velocità\n6) Pozione mortale\n7) Pozione teletrasporto",
            "Altruista": "In qualità di Altruista, sei un astronauta con la capacità di rianimare un giocatore morto segnalando il suo corpo (tasto SEGNALA). Il giocatore rianimato potrà continuare a giocare come se non fosse mai morto. Se rianimi un giocatore, ti sacrificherai. Puoi passare dalla modalità rianimazione a quella di segnalazione premendo il tasto PET.",
            "Ammaliatore": "In qualità di Ammaliatore, sei un neutrale con la capacità di ammaliare un giocatore non neutrale per renderlo parte del tuo team con nuove condizioni di vittoria. Il team degli ammaliati vince la partita se supera in numero gli astronauti e se rimangono solo queste due squadre in gioco. (tasto UCCIDI)",
            "Amministratore": "In qualità di Amministratore, sei un astronauta con la capacità di vedere la mappa admin da ovunque. Come client moddato, ogni volta che apri la mappa (e hai usi dell'abilità rimasti), apparirà la mappa admin. Come client vanilla, puoi premere il tasto PET per ricevere una notifica che indica quante persone si trovano nelle diverse stanze della nave (essenzialmente la mappa admin).",
            "Amnesico": "In qualità di Amnesico, sei un neutrale con la capacità di copiare il ruolo di un giocatore o di un corpo usandoci sopra il tasto abilità. Le impostazioni dell'host potrebbero alterare il ruolo che ricevi in alcuni scenari specifici. (tasto UCCIDI o SEGNALA)",
            "Analista": "In qualità di Analista, sei un astronauta con la capacità di analizzare gli altri giocatori (tasto PET). Dovrai restare vicino al tuo bersaglio per alcuni secondi per completare l'analisi. Al termine, vedrai quanti giocatori ha ucciso finora e quante volte è entrato nei condotti. Nota: Se le impostazioni dell'host non consentono di vedere un'informazione, il risultato mostrerà 0 o nulla! Nota: Nessuno di questi fattori determina se qualcuno sia malvagio o meno! Devi pensare bene prima di giudicare troppo in fretta!",
            "Anonimo": "In qualità di Anonimo, sei un impostore con la capacità di hackerare gli altri giocatori attraverso il tasto mutaforma. Il giocatore hackerato sarà costretto a segnalare il cadavere ucciso da te o il proprio, in caso non ce ne siano altri. L'hacking ignora le restrizioni sulla segnalazione dei corpi. Solo il PIGRO è immune all'hacking.",
            "Assessore": "In qualità di Assessore, sei un impostore con la capacità di uccidere un giocatore a tua scelta durante i meeting, proprio come un GIUDICE. L'abilità può essere usata solo una volta per partita. I client moddati vedranno l'icona di un coltello accanto al nome del giocatore, mentre i client non moddati dovranno aprire la chat e scrivere il comando /cmd tl id giocatore.",
            "Astrale": "In qualità di Astrale, sei un astronauta con la capacità di diventare un fantasma per un breve periodo (tasto PET). Da fantasma puoi andare in giro a controllare gli altri giocatori. Al termine dell'abilità, ritorni ad essere vivo.",
            "Astrologo": "In qualità di Astrologo, sei un astronauta con la capacità di tentare di indovinare il ruolo di un giocatore durante la riunione (puoi indovinare impostori, neutrali e membri della congrega). Se indovini correttamente, il bersaglio verrà ucciso; se sbagli, morirai per suicidio. Nei client moddati vedrai un mirino accanto ai nomi dei giocatori, mentre nei client normali dovrai scrivere in chat il comando /cmd bt id giocatore ruolo per tentare. Puoi vedere l'ID dei giocatori accanto ai loro nomi oppure usando il comando /cmd id.",
            "Augure": "In qualità di Augure, sei un membro della congrega con la capacità di indovinare i ruoli dei giocatori durante le riunioni. Se sbagli a indovinare, non muori, ma non puoi riprovare fino alla prossima riunione. Non puoi ottenere il Necronomicon, similmente a un Mietitore. Nei client moddati apparirà un mirino accanto ai nomi dei giocatori, in quelli normali andrà inserito in chat il comando /cmd bt id ruolo.",
            "Avvocato": "In qualità di Avvocato, sei un neutrale con la capacità di difendere un bersaglio specifico, il quale è indicato da un diamante accanto al suo nome. Se il tuo bersaglio vince la partita, vinci anche tu, ma se il bersaglio perde, perdi di conseguenza. (nessun tasto abilità)",
            "Avvoltoio": "In qualità di Avvoltoio, sei un neutrale con la capacità di divorare i cadaveri segnalandoli per ottenere la vittoria. Quando segnali un corpo, se il tempo di ricarica per mangiare è terminato, lo divorerai rendendolo non segnalabile. Se l'abilità è ancora in ricarica, oppure se viene raggiunto il limite massimo di corpi mangiati per round, segnalerai il corpo normalmente. (tasto SEGNALA)",
            "Banshee": "In qualità di Banshee, sei un membro della congrega con la capacità di emettere un grido verso i giocatori vicini per renderli sordi (tasto SVANISCI), rendendoli incapaci di sentire o vedere la chat durante la prossima riunione. Con il Necronomicon, il tuo grido diventa letale.",
            "Barbiere": "In qualità di Barbiere, sei un astronauta con la capacità di cancellare il ruolo di un giocatore scegliendolo dal tuo menu MUTAFORMA durante i meeting. Il ruolo del giocatore scelto verrà riportato a quello base (Astronauta semplice o Impostore semplice) dopo la riunione. Questa abilità ha un numero limitato di utilizzi.",
            "Bodyguard": "In qualità di Bodyguard, sei un astronauta con la capacità di impedire un'uccisione sacrificando la tua vita quando un giocatore sta per essere ucciso nelle tue vicinanze. La tua abilità protegge qualsiasi squadra.",
            "Bombarolo": "In qualità di Bombarolo, sei un impostore con la capacità di piazzare bombe a orologeria con il tasto SVANISCI. La bomba esploderà dopo un certo periodo di tempo uccidendo chiunque si trovi nelle vicinanze (tu incluso). Puoi anche uccidere normalmente, così facendo aumenta il numero di bombe da poter piazzare.",
            "Borseggiatore": "In qualità di Borseggiatore, sei un neutrale con la capacità di rubare i voti dalle tue vittime. Il tuo unico obiettivo è uccidere tutti per ottenere la vittoria. (tasto UCCIDI)",
            "Bracconiere": "In qualità di Bracconiere, sei un membro della congrega con la capacità di avvelenare un giocatore, rendendolo incapace di votare nella riunione successiva. I giocatori non sapranno di essere stati avvelenati. Dopo aver ottenuto il Necronomicon, i giocatori avvelenati moriranno pochi secondi (determinati dalle impostazioni dell'host) dopo essere stati avvelenati.",
            "Burattinaio": "In qualità di Burattinaio, sei un impostore con la capacità di manipolare altri giocatori costringendoli ad uccidere al tuo posto premendo una volta il tasto UCCIDI, o uccidere direttamente premendolo due volte. Il giocatore manipolato ucciderà la prima persona incontrata.",
            "Buttafuori": "In qualità di Buttafuori, sei un astronauta con la capacità di non far entrare i giocatori nella stanza in cui ti trovi attualmente premendo il tasto PET.",
            "Cacciatore di taglie": "In qualità di Cacciatore di taglie, sei un impostore con la capacità di ottenere una ricarica uccisione ridotta se uccidi il bersaglio assegnato (il suo nome apparirà sotto al tuo assieme al timer). Nel caso in cui si uccida un giocatore diverso dal bersaglio assegnato, la ricarica uccisione aumenta.",
            "Camaleonte": "In qualità di Camaleonte, sei un astronauta con la capacità di usare il tuo tasto PET per camuffarti e diventare temporaneamente invisibile. Mentre sei camuffato, nessuno può interagire con te. Usare nuovamente il tasto PET mentre sei camuffato ti renderà nuovamente visibile.",
            "Cameraman": "In qualità di Cameraman, sei un astronauta con la capacità di teletrasportarti istantaneamente nella stanza della sicurezza (tasto PET).",
            "Camuffatore": "In qualità di Camuffatore, sei un impostore con la capacità di rendere tutti i giocatori uguali tra loro (tutti diventeranno grigi) con il tasto SVANISCI. L'effetto è applicato fino a quando non tornerai normale.",
            "Canalista": "In qualità di Canalista, sei un astronauta con la capacità di entrare nei condotti per bloccarli. Nessuno può entrare nei condotti bloccati, eccetto gli Astronauti se l'impostazione è attiva. Verrai notificato se qualcuno prova a usare il condotto che hai bloccato. I condotti bloccati si resettano dopo ogni riunione.",
            "Candeliere": "In qualità di Candeliere, sei un astronauta con la capacità di accendere una nuova candela completando una missione, il che imposta la tua vista al massimo. Con il passare del tempo e il consumarsi della candela, la tua vista si ridurrà progressivamente. Poiché usi le candele, sei immune al sabotaggio delle luci.",
            "Capitano": "In qualità di Capitano, sei un astronauta con la capacità di vedere sempre chi si trova nella tua stessa stanza. Inoltre, nei meeting, potrai utilizzare il tuo menù MUTAFORMA per scegliere un giocatore e, nel meeting successivo, riceverai l'elenco delle stanze in cui è entrato (in ordine) durante il round precedente.",
            "Carnefice": "In qualità di Carnefice, sei un impostore con la capacità di ridurre la tua ricarica uccisione dopo ogni uccisione effettuata.",
            "Cartomante": "In qualità di Cartomante, sei un astronauta con la capacità di ottenere un indizio sul ruolo di un giocatore selezionandolo con il menu MUTAFORMA. Una volta che tutte le tue task saranno completate, non riceverai più solo un indizio, ma scoprirai il ruolo esatto del giocatore votato.",
            "Celebrità": "In qualità di Celebrità, sei un astronauta con la capacità di avere l'icona di una stella accanto al tuo nome e puoi essere ucciso solo se l'assassino si trova da solo con te. Gli Indovini (Guessers) non possono indovinare il tuo ruolo.",
            "Chiacchierone": "In qualità di Chiacchierone, sei un astronauta con la capacità di marchiare un giocatore come tuo obiettivo cliccando sulla palla di cristallo accanto al nome (client moddati) o selezionandolo col menù MUTAFORMA (client normali). Quando verrai eliminato, tutti scopriranno il ruolo del giocatore marchiato.",
            "Collezionista di Anime": "In qualità di Collezionista di Anime, sei un neutrale con la capacità di uccidere i tuoi bersagli facendo in modo che gli altri continuino a vederli come se fossero ancora in vita. Gli obiettivi muoiono completamente solo al momento in cui viene convocata una riunione. (tasto UCCIDI)",
            "Confessore": "In qualità di Confessore, sei un astronauta con la capacità di rinchiudere un giocatore in confessionale (tasto PET). I giocatori in confessione non possono essere indovinati o giudicati e possono indovinare solo la tua identità. Mentre sono in confessione, i confessati possono comunicare privatamente con te usando /cmd jailtalk messaggio.",
            "Controllore": "In qualità di Controllore, sei un astronauta con la capacità di monitorare una stanza (tasto PET). In futuro, riceverai informazioni da quella stanza, tra cui: il numero giocatori attualmente in quella stanza e chi è morto in quella stanza (se presente). Riceverai anche una notifica quando qualcuno usa un condotto o si trasforma in quella stanza. In base alle impostazioni, i giocatori potrebbero sapere se una stanza è monitorata e potresti non essere in grado di visualizzare queste info durante i sabotaggi alle comunicazioni.",
            "Corruttore": "In qualità di Corruttore, sei un neutrale con la capacità di maledire i giocatori o di ucciderli fisicamente. Cliccando una volta lanci un maleficio letale simile a quello di una Strega, mentre cliccando due volte procedi con un'uccisione normale. (tasto UCCIDI)",
            "Cospiratore": "In qualità di Cospiratore, sei un astronauta con la capacità di imitare il ruolo di un giocatore morto. I client moddati vedranno un mirino accanto ai nomi dei giocatori nei meeting. I client normali dovranno usare il comando /cmd imitate id. Puoi imitare solo i ruoli degli astronauti.",
            "Crittografo": "In qualità di Crittografo, sei un astronauta con la capacità di scoprire una lettera in più dei ruoli di tutti ogni X missioni completate (X è stabilito dall'host). Puoi vedere queste lettere sotto i nomi delle persone. Le lettere non sono in ordine e ogni lettera appare una sola volta per ogni occorrenza nel nome del ruolo. Le impostazioni determinano se puoi indovinare.",
            "Crociato": "In qualità di Crociato, sei un astronauta con la capacità di proteggere un giocatore. Se il giocatore protetto viene attaccato, ucciderai l'aggressore automaticamente. (tasto PET).",
            "Cronomante": "In qualità di Cronomante, sei un impostore con la capacità di caricare il tuo tasto UCCIDI (ogni secondo viene caricato l'1%) e, in base alle cariche, poter effettuare delle uccisioni multiple. Ogni uccisione consuma il 25% delle cariche.",
            "Dea": "In qualità di Dea, sei un membro della congrega con la capacità di usare uno sguardo pietrificante (tasto SVANISCI), causando la morte di chiunque interagisca con te, proprio come un Veterano. A differenza di un Veterano, tutti i corpi saranno pietrificati e non potranno essere segnalati. Dopo aver ottenuto il Necronomicon, puoi uccidere i giocatori direttamente e saranno comunque pietrificati.",
            "Demolitore": "In qualità di Demolitore, sei un astronauta con la capacità di costringere il tuo assassino a entrare in un condotto entro 5 secondi per sopravvivere, quando vieni ucciso. L'assassino deve trovarsi all'interno del condotto allo scadere dei 5 secondi, altrimenti morirà a sua volta.",
            "Dispersore": "In qualità di Dispersore, sei un impostore con la capacità di teletrasportare gli altri (eccetto te stesso) vicino ad una botola casuale utilizzando il tasto SVANISCI. Più uccisioni effettuerai, più potrai utilizzare questa abilità.",
            "Dittatore": "In qualità di Dittatore, sei un astronauta con la capacità di terminare istantaneamente la riunione votando qualcuno. Questo comporterà l'espulsione immediata del bersaglio, ma causerà anche la tua morte subito dopo.",
            "Dottore": "In qualità di Dottore, sei un astronauta con la capacità di visualizzare la causa della morte dei giocatori e accedere ai loro parametri vitali finché la tua batteria è operativa.",
            "Druido": "In qualità di Druido, sei un astronauta con la capacità di piazzare un innesco dove ti trovi (tasto PET). Se un giocatore passa vicino all'innesco, verrai avvisato.",
            "Enigmista": "In qualità di Enigmista, sei un astronauta con la capacità di ricevere un indizio casuale sull'assassino a ogni riunione. A seconda dell'impostazione, potresti dover segnalare il corpo per riceverne uno. Più missioni completi, più gli indizi diventano precisi.",
            "Esecutore": "In qualità di Esecutore, sei un neutrale con la capacità di far espellere il tuo bersaglio durante le riunioni per vincere. Il bersaglio è indicato da un simbolo di diamante accanto al nome. Se il bersaglio muore in altri modi, puoi diventare un Astronauta, un Giullare o un Opportunista. (nessun tasto abilità)",
            "Esorcista": "In qualità di Esorcista, sei un impostore con la capacità di uccidere chiunque scriva un messaggio in chat durante i meeting digitando il comando /exo in chat. Il comando può essere usato solo due volte a partita e per un certo periodo di tempo prestabilito dall'host.",
            "Evasore": "In qualità di Evasore, sei un impostore con la capacità di marchiare una posizione (tasto SVANISCI) e, dopo un certo periodo di tempo indicato da un timer, teletrasportarti alla posizione marchiata da ovunque tu ti trovi.",
            "Evocatore": "In qualità di Evocatore, sei un membro della congrega con la capacità di usare /cmd summon {ID giocatore} (o il menu di espulsione) per selezionare un giocatore morto da rianimare (evocare) dopo la riunione. Il giocatore evocato avrà un certo tempo per uccidere al posto tuo. Se ci riesce, potrà vincere insieme a te, oltre che con la sua squadra originale. In caso contrario, morirà di nuovo al termine del limite di tempo, se non è già morto. Con il Necronomicon, ottieni un pulsante di uccisione (tasto UCCIDI) e l'abilità di uccidere normalmente. Digita /cmd id per ottenere un elenco degli ID dei giocatori, o visualizzali accanto ai nomi dei giocatori nella schermata della riunione. Esempio d'uso: /cmd summon 5.",
            "Fabbricatore": "In qualità di Fabbricatore, sei un impostore con la capacità di falsare la causa della morte delle tue vittime. Per far ciò devi digitare in chat il seguente comando: /cmd fabbrica e aggiungere una delle seguenti cause di morte: AFK, Allergia, Vergogna, Presunto, Asma, Sfortuna, Bancarotta, Morso, Buggato, Esploso, Collassato, Consumato, Maledetto, Assordato, Distrutto, Demolito, Non Ha Votato, Disconnesso, Malato, Smembrato, Trascinato, Annegato, Ecato, Giustiziato, Cuore Infranto, Spaventato, Indovinato, Hackerato, Infetto, Iettato, Sacrificato, Ucciso, Lava, Fulmine, Perdita Di Sangue, Strangolato, Dilaniato, Meteorizzato, Cilecca, Indovinello Errato, Negoziazione, Fuori Ossigeno, Esausto, Pattugliato, Avvelenato, Quantizzato, RNG, Retribuzione, Vendetta, Sacrificio, Spazzato, Sparo, Votazione Saltata, Cecchinato, Stregato, Pietrificato, Punto, Suicidio, Affondato, Tasse, Bruciato, Tornado, Intrappolato, Espulso, Sterminato, Risposta Sbagliata, Istigato, Altro.",
            "Forgiatore": "In qualità di Forgiatore, sei un impostore con la capacità di assegnare finti ruoli ai giocatori morti. Per far ciò, i client moddati avranno un pulsante incudine accanto al nome dei giocatori durante i meeting, i client non moddati dovranno invece eseguire in chat il comando /cmd forgia id ruolo, dove id è il numero accanto al nome del giocatore e il ruolo potrà essere scelto soltanto tra quelli selezionati dall'host.",
            "Fuggitivo": "In qualità di Fuggitivo, sei un astronauta con la capacità di segnare una posizione e successivamente teletrasportarti di nuovo in quel punto (tasto PET).",
            "Giardiniere": "In qualità di Giardiniere, sei un astronauta con la capacità di piazzare una pianta (tasto PET). Dopo la riunione successiva, la pianta sarà cresciuta e nessuno potrà uccidere direttamente nelle sue vicinanze. Tuttavia, una volta che una pianta ha bloccato un tentativo di uccisione, scompare.",
            "Giornalista": "In qualità di Giornalista, sei un astronauta con la capacità di scrivere degli appunti tramite comandi in chat. Quando muori, tutti i giocatori vedranno le tue note nella riunione successiva. I comandi da inserire sono i seguenti: /cmd note add [messaggio] per aggiungere note, /cmd note remove [messaggio] per rimuovere una nota, /cmd note clear per rimuovere tutte le note e /cmd note view per vedere tutte le note.",
            "Giudice": "In qualità di Giudice, sei un astronauta con la capacità di emettere una sentenza su un giocatore durante la riunione. Se il bersaglio è malvagio, verrà ucciso, ma se invece è buono sarai tu a morire. I client moddati vedranno l'icona di un martelletto accanto ai nomi dei giocatori, quelli normali invece dovranno digitare in chat /cmd tl [id], dove l'id è il numerino che appare accanto ai nomi dei giocatori e va scritto senza parentesi.",
            "Giullare": "In qualità di Giullare, sei un neutrale con la capacità di vincere da solo facendoti espellere tramite i voti durante i meeting. Tuttavia, perdi la partita se sei ancora vivo alla fine del gioco. Puoi usare i condotti ma non spostarti da un condotto all'altro. (nessun tasto abilità)",
            "Granatiere": "In qualità di Granatiere, sei un astronauta con la capacità di lanciare una granata stordente che acceca gli Impostori (tasto PET). In base alle impostazioni, la granata può colpire anche i Neutrali.",
            "Guardiano Notturno": "In qualità di Guardiano Notturno, sei un astronauta con la capacità di non poter essere ucciso durante il sabotaggio delle luci.",
            "Incantatore": "In qualità di Incantatore, sei un membro della congrega con la capacità di incantare un giocatore per farlo apparire come membro della Congrega agli investigatori degli astronauti. Quando un giocatore incantato viene ucciso, la causa della morte sarà casuale. Se potenziato dal Necronomicon, ottieni l'abilità di uccidere (facendo doppio clic con il tasto UCCIDI su qualcuno).",
            "Indovino Malvagio": "In qualità di Indovino Malvagio, sei un impostore con la capacità di indovinare i ruoli di Astronauti, Neutrali e Congrega durante i meeting. Se indovini un ruolo, il giocatore con quel ruolo morirà, altrimenti sarai tu stesso a morire suicidandoti. Nei client moddati per indovinare apparirà un mirino a fianco ad ogni giocatore e poi si potrà scegliere il ruolo, in quelli non moddati si dovrà usare il comando in chat /cmd bt id ruolo.",
            "Influencer": "In qualità di Influencer, sei un impostore con la capacità di costringere gli altri giocatori a votare lo stesso giocatore che voti tu premendo una volta il tasto UCCIDI. Premendolo due volte invece, si eseguirà un'uccisione normale.",
            "Infiltrato": "In qualità di Infiltrato, sei un astronauta con la capacità di diventare invisibile durante i sabotaggi.",
            "Ingannatore": "In qualità di Ingannatore, sei un impostore con la capacità di apparire come un astronauta ai ruoli controllori. Inoltre possiedi altre caratteristiche tra cui: 1) Lo SCERIFFO non può ucciderti. 2) Lo PSICHICO non ti rileva come giocatore cattivo. 3) Non puoi essere individuato dalla SPIA.",
            "Inibitore": "In qualità di Inibitore, sei un astronauta con la capacità di bloccare il ruolo di un giocatore per un tempo determinato (tasto PET). Un giocatore con il ruolo bloccato non può uccidere, usare i condotti, sabotare o segnalare corpi.",
            "Innocente": "In qualità di Innocente, sei un neutrale con la capacità di incastrare un altro giocatore, costringendolo a ucciderti all'istante. Se il giocatore incastrato viene successivamente espulso durante la votazione, ottieni la vittoria. (tasto UCCIDI)",
            "Inquirente": "In qualità di Inquirente, sei un astronauta con la capacità di verificare se un giocatore ha un ruolo specifico, con una certa probabilità di fallimento. Per i client moddati apparirà un pulsante accanto ai nomi dei giocatori, quelli non moddati invece dovranno digitare in chat /cmd controlla id ruolo.",
            "Inquisitore": "In qualità di Inquisitore, sei un astronauta con la capacità di vedere di chi conosce il ruolo un giocatore, scegliendo dal menu MUTAFORMA durante i meeting.",
            "Intercettatore": "In qualità di Intercettatore, sei un impostore con la capacità di rilevare Astronauti o Neutrali nelle vicinanze dei dispositivi di controllo (Telecamere, Admin, ecc.). Non puoi sapere se effettivamente un giocatore stia facendo uso dei dispositivi, ma puoi usare il menù MUTAFORMA per mandare un segnale di morte imminente a tutti coloro che lo stiano facendo.",
            "Inversore": "In qualità di Inversore, sei un impostore con la capacità di invertire temporaneamente i comandi di un altro giocatore attraverso l'uso del menù MUTAFORMA.",
            "Invocatore di spiriti": "In qualità di Invocatore di spiriti, sei un neutrale con la capacità di trasformare le tue vittime in Spiriti Malvagi dopo la morte. Questi spiriti ti aiutano a vincere congelando gli avversari, bloccandone la visuale o fornendoti uno scudo temporaneo contro i tentativi di uccisione. (tasto UCCIDI)",
            "Ipnotista": "In qualità di Ipnotista, sei un impostore con la capacità di ipnotizzare gli altri giocatori, impedendo loro di poter segnalare i cadaveri per un certo periodo di tempo (tasto Svanisci).",
            "Ispettore": "In qualità di Ispettore, sei un astronauta con la capacità di verificare se due giocatori appartengono alla stessa squadra. Gli assassini Neutrali contano come una squadra unica, mentre i Neutrali non assassini contano come squadre separate. Per i client moddati apparirà un pulsante accanto ai nomi dei giocatori, quelli non moddati invece dovranno digitare in chat /cmd cp [id 1] [id 2].",
            "Istigatore": "In qualità di Istigatore, sei un impostore con la capacità di far si che due giocatori si uccidano a vicenda. Marchi un primo giocatore (tasto UCCIDI) e dopo alcuni secondi ne puoi marchiare un altro (sempre con il tasto UCCIDI). Quando i due giocatori marchiati si trovano a distanza di uccisione, si uccideranno a vicenda.",
            "Ladro del Tempo": "In qualità di Ladro del Tempo, sei un impostore con la capacità di ridurre la durata del meeting effettuando uccisioni. Più uccisioni verranno fatte, meno durerà il meeting.",
            "Limitatore": "In qualità di Limitatore, sei un impostore con la capacità di bloccare il ruolo degli altri giocatori premendo una volta il tasto UCCIDI. Il giocatore bloccato non potrà eseguire nessuna azione per un certo periodo di tempo. Premendo due volte il tasto UCCIDI verrà eseguita un'uccisione normale.",
            "Ludopatico": "In qualità di Ludopatico, sei un impostore con la capacità di generare degli effetti randomici dopo ogni uccisione. Questi effetti possono essere al 50% positivi o negativi.",
            "Lupo Mannaro": "In qualità di Lupo Mannaro, sei un neutrale con la capacità di entrare in furia utilizzando i condotti, ottenendo così una ricarica dell'uccisione molto breve. Non puoi uccidere quando non sei in furia, dato che quest'ultima ha una durata limitata e un proprio tempo di ricarica. (tasto CONDOTTO)",
            "Macchina Assassina": "In qualità di Macchina Assassina, sei un impostore con una ricarica uccisione molto bassa. Tuttavia non puoi usare i condotti, hai una visuale ridotta e non puoi sabotare, segnalare corpi o indire meeting d'emergenza.",
            "Macellaio": "In qualità di Macellaio, sei un impostore con la capacità di far confondere gli altri giocatori. Quando effettui un'uccisione, farai spawnare 30 cadaveri, rendendo più difficile la segnalazione da parte degli altri giocatori.",
            "Maestro del tempo": "In qualità di Maestro del tempo, sei un astronauta con la capacità di riavvolgere il tempo di alcuni secondi (tasto PET). I giocatori verranno teletrasportati nelle posizioni in cui si trovavano in quel momento e coloro che sono morti durante quell'intervallo verranno riportati in vita.",
            "Maestro delle armi": "In qualità di Maestro delle armi, sei un neutrale con la capacità di alternare diverse armi per uccidere o difendersi. Puoi usare la spada per attacchi standard, l'ascia per colpire ad area con un tempo di ricarica maggiore, la lancia per massimizzare la portata senza eseguire uno scatto, oppure lo scudo per sopravvivere a un singolo attacco nemico. (tasto SABOTAGGIO / PET)",
            "Maestro Voodoo": "In qualità di Maestro Voodoo, sei un membro della congrega con la capacità di costringere qualcuno a usare la propria abilità su se stesso o in generale (come il Tornado o il Camuffatore). Dopo aver ottenuto il Necronomicon, ucciderai anche il bersaglio.",
            "Mafioso": "In qualità di Mafioso, sei un impostore con la capacità di evolvere le tue abilità aumentando di livello. Il livello aumenta accumulando esperienza (Uccisioni, sabotaggi, uso dei condotti, espulsione giocatori non impostori). Qui di seguito vengono riportati tutti i livelli con le conseguenti abilità:\nLivello 0: Impostore normale, tempo di ricarica uccisione più lungo, raggio d'uccisione corto.\nLivello 1: Raggio d'uccisione lungo, tempo di ricarica uccisione normale.\nLivello 2: Tempo di ricarica uccisione ridotto.\nLivello 3: Doppie pistole: hai 2 tempi di ricarica uccisione separati più lunghi, se almeno uno è pronto, puoi uccidere!\nLivello 4: Tempo di ricarica uccisione normale su entrambe le pistole.\nLivello 5: Uccisioni in ritardo. (come il VAMPIRO)",
            "Mago": "In qualità di Mago, sei un neutrale con la capacità di ottenere una carta con effetti speciali in seguito a ogni uccisione effettuata. Puoi attivare e giocare la carta ottenuta innescando un qualsiasi sabotaggio oppure interagendo con il pet per applicarne gli effetti sui giocatori. (tasto SABOTAGGIO / PET)",
            "Matematico": "In qualità di Matematico, sei un astronauta con la capacità di porre un quesito matematico tramite un comando in chat (/cmd chiedi [numero] [numero]). Il primo giocatore a rispondere correttamente riceverà un utilizzo dell'abilità extra e uno scudo per il round successivo.",
            "Medico": "In qualità di Medico, sei un astronauta con la capacità di applicare uno scudo a un giocatore (tasto PET). Lo scudo protegge il bersaglio e viene rimosso se qualcuno tenta di ucciderlo o se muori. Inoltre, puoi anche vedere quando qualcuno rompe lo scudo attraverso un flash luminoso.",
            "Menestrello": "In qualità di Menestrello, sei un astronauta con la capacità di iniziare a cantare (tasto PET). Durante questo periodo, nessuno può usare i condotti o trasformarsi perché distratto dalla tua canzone.",
            "Mietitore": "In qualità di Mietitore, sei un membro della congrega con la capacità di maledire un giocatore; quando un giocatore maledetto muore, guadagni un'anima. Al raggiungimento di un numero specifico di anime (impostato dall'host) (o se sei l'ultimo assassino vivo), diventi MORTE. Non puoi usare il Necronomicon per potenziare i tuoi poteri.",
            "Miracolato": "In qualità di Miracolato, sei un astronauta con la capacità di schivare un tentativo di uccisione con una probabilità impostata dall'host. L'assassino vedrà l'animazione di uno scudo, ma rimarrai inconsapevole del pericolo scampato.",
            "Moderatore": "In qualità di Moderatore, sei un astronauta con la capacità di conoscere i ruoli dei giocatori indovinati e sapere se qualcuno sbaglia a indovinare. Vedi anche se vengono usati altri comandi riunione che altrimenti rimarrebbero nascosti.",
            "Necrologo": "In qualità di Necrologo, sei un neutrale con la capacità di indovinare i ruoli dei giocatori morti utilizzando un apposito comando in chat. Devi indovinare un certo numero di ruoli per poter vincere insieme alla squadra vincitrice alla fine della partita. Per indovinare, i client moddati vedranno un mirino accanto ai giocatori. I client normali dovranno digitare in chat /cmd bt id ruolo, dove l'id è il numerino che appare accanto ai nomi giocatore seguito dal ruolo che vogliono indovinare tra quelli scelti dall'host.",
            "Ninja": "In qualità di Ninja, sei un impostore con la capacità di poter uccidere discretamente gli altri giocatori. Marchi un giocatore con il tasto UCCIDI e, dopo un certo periodo di tempo, puoi premere il tasto SVANISCI per teletrasportarti dal giocatore marchiato, uccidendolo e diventando invisibile per alcuni secondi.",
            "Non-Morto": "In qualità di Non-Morto, sei un astronauta con la capacità di essere vivo durante il round e morto durante le riunioni. Devi completare tutti i tuoi compiti per sopravvivere alle riunioni e fornire agli astronauti le informazioni che hai appreso dai morti, con cui puoi anche chattare.",
            "Occultista": "In qualità di Occultista, sei un neutrale con la capacità di hackerare i giocatori per impedire loro di uccidere, usare i condotti, sabotare o segnalare corpi per un periodo limitato. Puoi inoltre camuffarti temporaneamente e ricaricare le tue abilità più velocemente nascondendoti nei condotti. (tasto MUTA)",
            "Ombra": "In qualità di Ombra, sei un membro della congrega con la capacità di sparire per mimetizzarti. Potresti essere in grado di mimetizzare la tua squadra usando il tasto UCCIDI su di loro. Con il Necronomicon, puoi uccidere e diventare invisibile dopo averlo fatto. Le tue abilità di mimetizzazione potrebbero essere trasformate in invisibilità. (Con l'abilità di mimetizzare i compagni di squadra, fai un clic singolo con il tasto UCCIDI per usarla e un doppio clic per uccidere normalmente).",
            "Onnisciente": "In qualità di Onnisciente, sei un astronauta con la capacità di vedere il numero di impostori e assassini neutrali rimasti (tasto PET).",
            "Oracolo": "In qualità di Oracolo, sei un astronauta con la capacità di scoprire se un giocatore è un Astronauta, un Neutrale o un Impostore. C'è la possibilità che tu riceva un risultato errato in base alle impostazioni dell'host. (Tasto MUTAFORMA durante i meeting)",
            "Ostruzionista": "In qualità di Ostruzionista, sei un impostore con la capacità di rallentare progressivamente gli altri giocatori durante i sabotaggi e, nel contempo, ridurre la tua ricarica uccisione per tutta la durata del sabotaggio.",
            "Pacifista": "In qualità di Pacifista, sei un astronauta con la capacità di resettare il tempo di ricarica dell'uccisione per tutti i giocatori che possiedono un'abilità di uccisione (tasto PET).",
            "Patologo": "In qualità di Patologo, sei un astronauta con la capacità di ricevere un indizio sul ruolo della vittima dopo aver segnalato un cadavere (tasto SEGNALA). In base alle impostazioni, potrebbe esserti rivelato anche il ruolo dell'assassino.",
            "Pellicano": "In qualità di Pellicano, sei un neutrale con la capacità di inghiottire i giocatori vivi, teletrasportandoli fuori dalla mappa e impedendo loro di interagire con la partita. I giocatori inghiottiti muoiono istantaneamente al momento della convocazione di una riunione o della segnalazione di un corpo, ma tornano liberi se muori o ti disconnetti. (tasto UCCIDI)",
            "Persuasore": "In qualità di Persuasore, sei un neutrale con la capacità di marcare i giocatori per impartire loro specifiche istruzioni vincolanti. Puoi ordinare agli assassini di usare il tasto uccidi o agli astronauti di completare una task, pena la morte entro la riunione successiva, e hai anche la facoltà di invertire tali istruzioni. (tasto CONDOTTO / SABOTAGGIO / PET)",
            "Pietrificatore": "In qualità di Pietrificatore, sei un impostore con la capacità di pietrificare temporaneamente un giocatore (tasto MUTAFORMA). Il giocatore pietrificato non potrà muoversi ne compiere azioni.",
            "Piromane": "In qualità di Piromane, sei un neutrale con la capacità di cospargere di benzina i giocatori seguendoli da vicino per alcuni secondi. Una volta che tutti i giocatori in vita sono stati completamente cosparsi, puoi innescare un incendio per ucciderli simultaneamente e vincere da solo. (tasto UCCIDI / CONDOTTO / PET)",
            "Portalista": "In qualità di Portalista, sei un astronauta con la capacità di piazzare due portali permanenti (tasto PET). Dopo aver piazzato entrambi i portali, chiunque si avvicini a uno di essi verrà teletrasportato all'altro. Una volta piazzati entrambi i portali, potrai anche rimuoverli cliccando di nuovo il tasto PET.",
            "Possessore": "In qualità di Possessore, sei un impostore con la capacità di assumere il controllo di un altro giocatore per un certo periodo di tempo usando il tuo menù MUTAFORMA. Al termine della possessione, il giocatore posseduto morirà esattamente nel punto in cui si trova. Non puoi uccidere normalmente.",
            "Posticipatore": "In qualità di Posticipatore, sei un impostore con la capacità di far apparire in ritardo i cadaveri delle tue uccisioni.",
            "Postino": "In qualità di Postino, sei un neutrale con la capacità di consegnare la posta a tutti i giocatori. Hai sempre un bersaglio assegnato e se consegni il messaggio al bersaglio sbagliato, morirai. Quando avrai consegnato la posta a tutti, la tua condizione di vittoria sarà soddisfatta e vincerai con la squadra vincitrice, qualunque cosa accada. (tasto UCCIDI)",
            "Pozionista": "In qualità di Pozionista, sei un membro della congrega con la capacità di usare pozioni sui giocatori per supportare la Congrega. Usare una pozione su un membro della Congrega gli fornisce uno scudo medico. Usare una pozione su un non membro della Congrega rivela il suo ruolo a tutti i membri della Congrega. Dopo aver ottenuto il Necronomicon, invece di rivelare i ruoli, uccidi i non membri della Congrega.",
            "Premonitore": "In qualità di Premonitore, sei un astronauta con la capacità di predire chi ti ucciderà. Se indovini, quando muori, tutti riceveranno una notifica dell'identità dell'assassino. (tasto MUTAFORMA durante i meeting)",
            "Prestigiatore": "In qualità di Prestigiatore, sei un astronauta con la capacità di cambiare in modo permanente Velocità, Visione e Tempo di ricarica uccisione dei giocatori. Puoi scorrere tra le statistiche (tasto PET), aumentarne il valore (tasto SVANISCI) e assegnarle a un giocatore (tasto UCCIDI).",
            "Profeta": "In qualità di Profeta, sei un neutrale con la capacità di indovinare i ruoli degli altri giocatori durante le riunioni utilizzando i comandi della chat. Se riesci a indovinare correttamente un certo numero di ruoli, il cui limite è stabilito dalle impostazioni dell'host, vinci la partita. Per indovinare, i client moddati vedranno un mirino accanto ai giocatori. I client normali dovranno digitare in chat /cmd bt id ruolo, dove l'id è il numerino che appare accanto ai nomi giocatore seguito dal ruolo che vogliono indovinare tra quelli scelti dall'host.",
            "Protettore": "In qualità di Protettore, sei un astronauta con la capacità di proteggere temporaneamente qualcuno dagli attacchi diretti. Contrassegni il tuo bersaglio (tasto PET) e attivi lo scudo entrando in un condotto (tasto CONDOTTO).",
            "Psichico": "In qualità di Psichico, sei un astronauta con la capacità di vedere i nomi di alcuni giocatori evidenziati in rosso durante le riunioni, il che indica la presenza di almeno un giocatore malvagio tra loro.",
            "Pulitore": "In qualità di Pulitore, sei un impostore con la capacità di rendere i cadaveri non segnalabili, ripulendoli col tuo tasto SEGNALA. Per questo motivo non puoi segnalare cadaveri a meno che la segnalazione non sia istantanea (faccia un velocissimo self-report).",
            "Retribuzionista": "In qualità di Retribuzionista, sei un astronauta con la capacità di contrassegnare un giocatore per sorvegliarlo (tasto PET). Se il bersaglio muore, ricevi una notifica e nella riunione successiva puoi usare un comando in chat per uccidere l'assassino del bersaglio. I client moddati avranno l'icona di un pugnale accanto a nomi dei giocatori, mentre quelli normali potranno o usare il menù MUTAFORMA o digitare in chat il comando /cmd retribute id, dove l'id è il numerino che compare accanto ai nomi dei giocatori.",
            "Revocatore": "In qualità di Revocatore, sei un impostore con la capacità di cancellare il ruolo dei giocatori astronauti, riportandoli al ruolo base, cliccando una volta col tasto UCCIDI. Cliccando invece due volte verrà eseguita una normale uccisione.",
            "Ricattatore": "In qualità di Ricattatore, sei un impostore con la capacità di silenziare i giocatori durante il meeting premendo il tasto SVANISCI. Il giocatore ricattato avrà una X rossa accanto al suo nome e non potrà parlare, votare o scrivere in chat fino al round dopo.",
            "Riparatore": "In qualità di Riparatore, sei un astronauta con la capacità di usare i condotti in qualsiasi momento e di riparare velocemente i sabotaggi. Puoi riparare Reattore, Ossigeno e Comunicazioni da un solo terminale, le luci con un solo interruttore e aprire automaticamente tutte le porte di un settore. Inoltre, se consentito dall'host, puoi anche riparare i sabotaggi pur non essendo fisicamente nelle stanze delle crisi col tasto PET.",
            "Ritualista": "In qualità di Ritualista, sei un neutrale con la capacità di svelare i ruoli degli altri giocatori o di ucciderli a seconda del numero di clic. Con un singolo clic riveli il ruolo del bersaglio, mentre con un doppio clic lo uccidi; tuttavia, una volta esauriti gli usi per rivelare, il tasto potrà essere usato solo per attacchi normali. (tasto UCCIDI)",
            "Rivendicatore": "In qualità di Rivendicatore, sei un impostore con la capacità di avere voti aggiuntivi durante il meeting.",
            "Sacrificatore": "In qualità di Sacrificatore, sei un impostore con la capacità di marchiare massimo due giocatori cliccando una volta il tasto UCCIDI su di loro. I giocatori marchiati moriranno nel momento in cui morirai anche tu. Cliccando due volte il tasto UCCIDI si eseguirà una normale uccisione.",
            "Scambiatore": "In qualità di Scambiatore, sei un astronauta con la capacità di scambiare i voti ricevuti da due giocatori. Ai client moddati saranno mostrate delle frecce accanto ai nomi dei giocatori, mentre quelli non moddati dovranno digitare in chat il comando /cmd sw id due volte.",
            "Scambista": "In qualità di Scambista, sei un impostore con la capacità di far scambiare di posto 2 giocatori attraverso il tuo tasto MUTAFORMA.",
            "Sceriffo": "In qualità di Sceriffo, sei un astronauta con la capacità di uccidere Impostori (tranne l'Ingannatore), Neutrali e Congrega (tasto PET). Se provi a uccidere un altro Astronauta, morirai tu stesso al suo posto.",
            "Segugio Malvagio": "In qualità di Segugio Malvagio, sei un impostore con la capacità di poter tracciare i movimenti degli altri giocatori, selezionandoli dal tuo menù MUTAFORMA. Una volta selezionato il giocatore, sotto al suo nome apparirà una freccia che ne indicherà i movimenti. Inoltre ricevi un avviso luminoso ogni volta che un altro impostore effettua un'uccisione e vedi l'ultima stanza in cui è stato il giocatore selezionato durante il meeting.",
            "Sentinella": "In qualità di Sentinella, sei un astronauta con la capacità di pattugliare l'area circostante (tasto CONDOTTO). Se un killer tenta di uccidere in quell'area durante il pattugliamento, verrà ucciso al tuo posto, e al termine del pattugliamento tutti i killer nell'area si suicidano.",
            "Serial Killer": "In qualità di Serial Killer, sei un neutrale con la capacità di eliminare tutti gli altri giocatori senza limiti o restrizioni aggiuntive per raggiungere la vittoria. (tasto UCCIDI)",
            "Sindaco": "In qualità di Sindaco, sei un astronauta con la capacità di far valere doppio il tuo voto. In base alle impostazioni, potresti avere l'abilità di attivare una riunione d'emergenza in qualsiasi momento con il tasto PET.",
            "Sirena": "In qualità di Sirena, sei un membro della congrega con la capacità di usare una voce ammaliante tramite l'abilità Canta (pulsante SVANISCI) per influenzare i giocatori vicini. Al primo ascolto, i non membri della Congrega vengono accecati e rallentati per un breve periodo. Al secondo, vengono nuovamente accecati e rallentati, e non possono segnalare i corpi temporaneamente. Al terzo, vengono Ammaliati, convertendosi alla Congrega. Con il Necronomicon, ottieni l'abilità di uccidere normalmente, e il tuo Canto viene potenziato di due stadi: I giocatori che non hanno ascoltato canzoni vengono trattati come se ne avessero ascoltate due. I giocatori che hanno ascoltato una canzone vengono trattati come se ne avessero ascoltate tre e vengono Ammaliati. Vedi un tracciatore vicino al nome di ogni giocatore che mostra il suo stadio attuale (0/3, 1/3, 2/3, Ammaliato).",
            "Sorvegliante": "In qualità di Sorvegliante, sei un impostore con la capacità di marchiare la stanza in cui ti trovi usando il tasto SVANISCI. Da quel momento, riceverai informazioni su quanti giocatori vivi sono in quella stanza. I cadaveri non vengono contati. Puoi avere la possibilità di marchiare più stanze in base alle impostazioni dell'host.",
            "Spaventatore": "In qualità di Spaventatore, sei un impostore con la capacità di selezionare un giocatore dal tuo menù MUTAFORMA, spaventandolo e rendendolo incapace di segnalare cadaveri o chiamare emergenze, pena il suicidio.",
            "Spia": "In qualità di Spia, sei un astronauta con la capacità di vedere i nomi degli Impostori in rosso durante le riunioni una volta completate le task. Quando ti rimane una sola task, sia tu che gli Impostori venite contrassegnati da una stella.",
            "Spirito": "In qualità di Spirito, sei un neutrale con la capacità di diventare temporaneamente invisibile nascondendoti o svanendo nell'ambiente. Puoi sfruttare questo vantaggio per continuare a uccidere mentre sei invisibile, con l'obiettivo di eliminare tutti i presenti. (tasto SVANISCI)",
            "Strega": "In qualità di Strega, sei un impostore con la capacità di maledire gli altri giocatori cliccando una volta con il tasto UCCIDI su di loro. I giocatori maledetti possono essere massimo 3 a round e vedranno una croce rossa accanto al loro nome durante i meeting e verranno uccisi se non dovessi essere uccisa o espulsa. Cliccando due volte il tasto UCCIDI si eseguirà una normale uccisione.",
            "Swooper": "In qualità di Swooper, sei un impostore con la capacità di diventare temporaneamente invisibile (tasto SVANISCI). Durante l'invisibilità, ti comporti come un normale impostore, potendo uccidere e sabotare ma senza la possibilità di usare i condotti.",
            "Telecomunicatore": "In qualità di Telecomunicatore, sei un astronauta con la capacità di ricevere una notifica quando qualcuno usa telecamere, parametri vitali, registri porte o admin. In base alle impostazioni, potresti anche aprire le porte chiuse (tasto PET).",
            "Tessitore di Sogni": "In qualità di Tessitore di Sogni, sei un membro della congrega con la capacità di tessere un giocatore; i giocatori tessuti diventeranno folli dopo la prossima riunione. Una volta folli, quando si avvicineranno a qualcuno, useranno immediatamente la loro abilità se il cooldown è terminato. Alla tua morte, tutti i giocatori folli saranno liberati. Se potenziato dal Necronomicon, i giocatori folli si suicideranno dopo essere entrati in contatto con un altro giocatore.",
            "Testimone": "In qualità di Testimone, sei un astronauta con la capacità di scoprire se un giocatore ha ucciso di recente o meno (tasto PET). Un punto esclamativo giallo significa che ha ucciso, mentre un segno di spunta verde significa che non l'ha fatto.",
            "Tiranno": "In qualità di Tiranno, sei un impostore con la capacità di annullare i voti degli altri giocatori (verrà assegnato loro il modificatore DEGRADATO) cliccando una volta il tasto UCCIDI (doppio click per uccidere normalmente). Vedrai i giocatori degradati in nero. Tutti i voti saranno ripristinati una volta che muori.",
            "Tiratore Rapido": "In qualità di Tiratore Rapido, sei un impostore con la capacità di immagazzinare proiettili (tasto SVANISCI). Fino a quando hai dei proiettili immagazzinati, la tua ricarica uccisione è 0. Durante i meeting però, tutti i proiettili andranno persi tranne uno.",
            "Trappolatore": "In qualità di Trappolatore, sei un impostore con la capacità di usare il tuo tasto SVANISCI per piazzare trappole invisibili che uccidono istantaneamente gli astronauti che le calpestano.",
            "Trasformista": "In qualità di Trasformista, sei un impostore con la capacità di cambiare l'aspetto di due giocatori, facendoli mutaformare in qualcun altro per un certo periodo di tempo. (tasto MUTAFORMA)",
            "Trasportatore": "In qualità di Trasportatore, sei un astronauta con la capacità di scambiare istantaneamente le posizioni di due bersagli (tasto MUTAFORMA) dopo aver completato le tue task.",
            "Untore": "In qualità di Untore, sei un neutrale con la capacità di infettare gli altri giocatori al fine di evolverti e trasformarti nella letale Pestilenza. Una volta completata la trasformazione, diventi quasi immortale, ottieni la capacità di uccidere direttamente gli avversari e contrattacchi letalmente chiunque provi a colpirti. (tasto UCCIDI)",
            "Vampiro": "In qualità di Vampiro, sei un impostore con la capacità di mordere gli altri giocatori cliccando una volta il tasto UCCIDI. I giocatori morsi moriranno dopo 10 secondi, dandoti così un potenziale alibi. Inoltre puoi anche effettuare uccisioni normali cliccando due volte il tasto UCCIDI.",
            "Vedetta": "In qualità di Vedetta, sei un astronauta con la capacità di vedere gli ID di ogni giocatore in ogni momento, permettendoti di vedere oltre i mutamenti e le mimetizzazioni.",
            "Veggente": "In qualità di Veggente, sei un astronauta con la capacità di rivelare il ruolo di un giocatore vicino (tasto PET). Devi rimanere vicino al bersaglio per un tempo prestabilito per completare la rivelazione.",
            "Veggente Malvagio": "In qualità di Veggente Malvagio, sei un impostore con la capacità di scoprire i ruoli degli altri giocatori cliccando una volta il tasto UCCIDI. Per uccidere basterà cliccare il tasto due volte.",
            "Ventriloquo": "In qualità di Ventriloquo, sei un impostore con la capacità di far scrivere messaggi in chat agli altri giocatori. Per far ciò bisogna innanzitutto scrivere in chat /cmd target id (l'ID è il numerino accanto ai nomi dei giocatori), e successivamente scrivere /cmd chat e il messaggio che si vuol far scrivere al giocatore selezionato.",
            "Veterano": "In qualità di Veterano, sei un astronauta con la capacità di entrare in uno stato di allerta (tasto PET). CHIUNQUE provi ad interagire con te mentre sei in stato di allerta, morirà."
        };

        let activePools = {};

        function initPools() {
            activePools = JSON.parse(JSON.stringify(basePools));
            drawnRoles = [];
        }

        function getRandomRole(category) {
            let pool = activePools[category];
            if (!pool || pool.length === 0) return { name: "Nessun ruolo", img: "" };
            let idx = Math.floor(Math.random() * pool.length);
            let roleName = pool.splice(idx, 1)[0]; 
            return { name: roleName, img: imagesMap[roleName] || "" };
        }

        function drawCards(isReset) {
            const qty = parseInt(document.getElementById("cardCount").value);
            
            if (isReset || drawnRoles.length === 0) {
                initPools();
            }

            while (drawnRoles.length < qty) {
                let currentIndex = drawnRoles.length;
                if (currentIndex >= drawSequence.length) break; 
                
                let categoryKey = drawSequence[currentIndex];
                let role = getRandomRole(categoryKey);
                
                drawnRoles.push({
                    cardNumber: currentIndex + 1,
                    categoryLabel: sequenceLabels[categoryKey],
                    name: role.name,
                    img: role.img
                });
            }

            renderRandomizerCards(qty);
        }

        function renderRandomizerCards(qty) {
            const container = document.getElementById("randomCardsContainer");
            container.innerHTML = ""; 

            for (let i = 0; i < qty; i++) {
                if (i >= drawnRoles.length) break;
                let role = drawnRoles[i];

                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                
                let imgTag = role.img ? `<img src="${role.img}" alt="${role.name}">` : `<div style="height:250px; display:flex; align-items:center;">Nessuna Immagine</div>`;
                let descText = descriptionsMap[role.name] || "Descrizione non ancora aggiunta per questo ruolo.";
                
                cardDiv.innerHTML = `
                    ${imgTag}
                    <div class="card-title">${role.name}</div>
                    <div class="card-category">Carta ${role.cardNumber} - ${role.categoryLabel}</div>
                    <div class="card-description">${descText}</div>
                `;
                container.appendChild(cardDiv);
            }
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Funzione per il cambio di sezione dal menu
        function switchTab(tabId, btnElement) {
            // Aggiorna lo stile dei pulsanti
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            if (tabId === 'randomizer') {
                document.getElementById('randomizer-section').style.display = 'block';
                document.getElementById('faction-section').style.display = 'none';
            } else {
                document.getElementById('randomizer-section').style.display = 'none';
                document.getElementById('faction-section').style.display = 'block';
                renderFaction(tabId);
            }
        }

        // Funzione per mostrare tutti i ruoli di una fazione specifica
        function renderFaction(categoryId) {
            const container = document.getElementById("factionCardsContainer");
            container.innerHTML = "";
            const roles = basePools[categoryId] || [];
            
            // Ordina alfabeticamente per facilitare la ricerca
            const sortedRoles = [...roles].sort((a, b) => a.localeCompare(b));

            sortedRoles.forEach(roleName => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                
                let imgPath = imagesMap[roleName] || "";
                let imgTag = imgPath ? `<img src="${imgPath}" alt="${roleName}">` : `<div style="height:250px; display:flex; align-items:center; justify-content:center;">Nessuna Immagine</div>`;
                let descText = descriptionsMap[roleName] || "Descrizione non ancora aggiunta per questo ruolo.";
                
                cardDiv.innerHTML = `
                    ${imgTag}
                    <div class="card-title">${roleName}</div>
                    <div class="card-category">${sequenceLabels[categoryId]}</div>
                    <div class="card-description">${descText}</div>
                `;
                container.appendChild(cardDiv);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initPools();
    </script>
</body>
</html>
