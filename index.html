<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay - Randomizer Ruoli</title>
    <style>
        /* Sfondo trasparente per OBS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            /* Nasconde la barra di scorrimento laterale su OBS */
            overflow-y: scroll; 
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { 
            display: none; 
        }

        h1 {
            color: #ff4757;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        }

        /* Pannello di controllo semitrasparente */
        .controls {
            margin-bottom: 30px;
            background-color: rgba(47, 53, 66, 0.85);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        select, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        select {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-draw {
            background-color: #2ed573;
            color: white;
            font-weight: bold;
        }
        .btn-draw:hover {
            background-color: #27ae60;
        }

        .btn-reset {
            background-color: #ff4757;
            color: white;
            font-weight: bold;
        }
        .btn-reset:hover {
            background-color: #e84118;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Carte con sfondo semitrasparente e ombra marcata per staccarsi dallo sfondo del gioco */
        .card {
            background-color: rgba(47, 53, 66, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 250px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .card-category {
            font-size: 15px;
            color: #ced6e0;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <h1>Estrazione Ruoli</h1>
    
    <div class="controls">
        <label for="cardCount">Carte da estrarre: </label>
        <select id="cardCount">
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
        </select>
        <button class="btn-draw" onclick="drawCards(false)">Estrai / Aggiungi</button>
        <button class="btn-reset" onclick="drawCards(true)">Resetta Tutto</button>
    </div>

        const drawSequence = [
            "astronauti_controllo",
            "astronauti_protezione",
            "astronauti_vari",
            "astronauti_vari",

            "astronauti_vari",

            "congrega"
        ];

        let activePools = {};
        let drawnRoles = [];

        function initPools() {
            activePools = JSON.parse(JSON.stringify(basePools));
            drawnRoles = [];
        }

        function getRandomRole(category) {
            let pool = activePools[category];
            if (!pool || pool.length === 0) return { name: "Nessun ruolo", img: "" };
            let idx = Math.floor(Math.random() * pool.length);
            let roleName = pool.splice(idx, 1)[0]; 
            return { name: roleName, img: imagesMap[roleName] || "" };
        }

        function drawCards(isReset) {
            const qty = parseInt(document.getElementById("cardCount").value);
            
            if (isReset || drawnRoles.length === 0) {
                initPools();
            }

            while (drawnRoles.length < qty) {
                let currentIndex = drawnRoles.length;
                if (currentIndex >= drawSequence.length) break; 
                
                let categoryKey = drawSequence[currentIndex];
                let role = getRandomRole(categoryKey);
                
                drawnRoles.push({
                    cardNumber: currentIndex + 1,
                    categoryLabel: sequenceLabels[categoryKey],
                    name: role.name,
                    img: role.img
                });
            }

            renderCards(qty);
        }

        function renderCards(qty) {
            const container = document.getElementById("cardsContainer");
            container.innerHTML = ""; 

            for (let i = 0; i < qty; i++) {
                if (i >= drawnRoles.length) break;
                let role = drawnRoles[i];

                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                
                let imgTag = role.img ? `<img src="${role.img}" alt="${role.name}">` : `<div style="height:250px; display:flex; align-items:center;">Nessuna Immagine</div>`;
                
                cardDiv.innerHTML = `
                    ${imgTag}
                    <div class="card-title">${role.name}</div>
                    <div class="card-category">Carta ${role.cardNumber} - ${role.categoryLabel}</div>
                `;
                container.appendChild(cardDiv);
            }
            
            // Fa scorrere la pagina verso il basso per mostrare le nuove carte estratte
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        initPools();
    </script>
</body>
</html>
